<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 40px;
        }

        h2 {
            color: #2b2d42;
            font-weight: 700;
            margin-bottom: 25px;
        }

        th {
            background: #edf2f4;
            color: #2b2d42;
            font-weight: bold;
        }

        .pagination-info {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Employee List</h2>

        <!-- Add New Employee Button -->
        <a th:href="@{/showNewEmployeeForm}" class="btn btn-primary">
            + Add New Employee
        </a>
    </div>

    <!-- Employee Table -->
    <table class="table table-hover table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{'/page/' + ${currentPage} + '?sortField=firstName&sortDir=' + ${reverseSortDir}}">
                    First Name
                </a>
            </th>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{'/page/' + ${currentPage} + '?sortField=lastName&sortDir=' + ${reverseSortDir}}">
                    Last Name
                </a>
            </th>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{'/page/' + ${currentPage} + '?sortField=email&sortDir=' + ${reverseSortDir}}">
                    Email
                </a>
            </th>
            <th class="text-center">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="employee : ${listEmployees}">
            <td th:text="${employee.firstName}"></td>
            <td th:text="${employee.lastName}"></td>
            <td th:text="${employee.email}"></td>
            <td class="text-center">
                <a th:href="@{'/showFormForUpdate/' + ${employee.id}}" class="btn btn-warning btn-sm">
                    Edit
                </a>
                <a th:href="@{'/deleteEmployee/' + ${employee.id}}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination Controls -->
    <div class="mt-4">

        <span class="pagination-info"
              th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}">
        </span>

        <div class="mt-3">

            <a th:if="${currentPage > 1}"
               th:href="@{'/page/' + (${currentPage} - 1) + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}"
               class="btn btn-outline-secondary">
                ← Previous
            </a>

            <a th:if="${currentPage < totalPages}"
               th:href="@{'/page/' + (${currentPage} + 1) + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}"
               class="btn btn-outline-secondary">
                Next →
            </a>
        </div>
    </div>

</div>

</body>
</html>
