<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            background: white;
            width: 450px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            font-weight: 700;
            color: #2d3142;
            margin-bottom: 25px;
        }

        .btn-custom {
            width: 100%;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>Add Employee</h2>

    <form th:action="@{/saveEmployee}" th:object="${employee}" method="POST">

        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" th:field="*{firstName}" placeholder="Enter First Name"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" th:field="*{lastName}" placeholder="Enter Last Name"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" th:field="*{email}" placeholder="Enter Email Address"
                   class="form-control">
        </div>

        <button type="submit" class="btn btn-primary btn-custom">Save Employee</button>

    </form>

</div>

</body>
</html>
